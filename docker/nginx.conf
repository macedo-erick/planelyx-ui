# In-container nginx. The host nginx forwards /ui/ here verbatim (no path stripping), so
# this server owns the /ui/ prefix end to end and nothing has to be rewritten.

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Emit relative Location headers. Otherwise nginx builds them from this server's own
    # port (8080) rather than the public one, and redirects point somewhere unreachable.
    absolute_redirect off;

    # index.html names the hashed asset files, so caching it would pin clients to a
    # previous deploy's bundles.
    location = /ui/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # `outputHashing: all` names these files `<name>-<hash>.<ext>`, e.g. main-2QIRCC62.js
    # or chunk-ByAJ-QBR.js — an 8-character base64url hash after a hyphen, not a hex digest
    # after a dot. Matching exactly 8 is deliberate: it keeps unhashed assets copied from
    # public/ (apple-touch-icon.png) out of the immutable bucket.
    # Quoted because nginx would otherwise read {8} as a block delimiter.
    location ~* "^/ui/.+-[A-Za-z0-9_-]{8}\.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback. Also serves /ui/silent-check-sso.html, which keycloak-js loads in a
    # hidden iframe to refresh the session.
    location /ui/ {
        try_files $uri $uri/ /ui/index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 302 /ui/;
    }
}
