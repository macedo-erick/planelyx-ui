name: release

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Workload Identity Federation

env:
  REGION: southamerica-east1
  REPOSITORY: planelyx
  IMAGE: ui

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - run: yarn install --frozen-lockfile

      # Non-blocking: master currently has 15 pre-existing eslint errors and 2 unformatted
      # files, none of them deployment-related. Flip these to blocking once that backlog is
      # cleared — a release gate that is red on arrival just teaches people to ignore it.
      - run: yarn lint
        continue-on-error: true
      - run: yarn format:check
        continue-on-error: true

      - run: yarn test

  build-push:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      # The image bakes in environment.production.ts, so it is environment-specific:
      # a staging deploy needs its own build, not just different env vars.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: echo "Deploy with UI_TAG=${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
