<p-dialog
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  [header]="heading()"
  [modal]="true"
  [style]="{ width: '28rem', maxWidth: 'calc(100vw - 2rem)' }"
  [draggable]="false"
>
  <p class="mb-4 text-sm text-[var(--p-text-muted-color)]">
    {{ t('transactions.scope.intro') }}
  </p>

  <div class="flex flex-col gap-3" role="radiogroup" [attr.aria-label]="heading()">
    <div class="flex items-start gap-3">
      <p-radiobutton name="scope" value="SINGLE" inputId="scope-single" [(ngModel)]="scope" />
      <label for="scope-single" class="cursor-pointer">
        <span class="block font-medium">{{ t('transactions.scope.single') }}</span>
        <span class="block text-sm text-[var(--p-text-muted-color)]">
          {{ t('transactions.scope.singleHint') }}
        </span>
      </label>
    </div>

    <div class="flex items-start gap-3">
      <p-radiobutton name="scope" value="FUTURE" inputId="scope-future" [(ngModel)]="scope" />
      <label for="scope-future" class="cursor-pointer">
        <span class="block font-medium">{{ t('transactions.scope.future', unitParams()) }}</span>
        <span class="block text-sm text-[var(--p-text-muted-color)]">
          {{ t('transactions.scope.futureHint', unitParams()) }}
        </span>
      </label>
    </div>

    <div class="flex items-start gap-3">
      <p-radiobutton name="scope" value="ALL" inputId="scope-all" [(ngModel)]="scope" />
      <label for="scope-all" class="cursor-pointer">
        <span class="block font-medium">{{ t('transactions.scope.all', unitParams()) }}</span>
        <span class="block text-sm text-[var(--p-text-muted-color)]">
          {{ t('transactions.scope.allHint', unitParams()) }}
        </span>
      </label>
    </div>
  </div>

  @if (mode() === 'delete' && scope() !== 'SINGLE') {
    <p class="mt-4 rounded-md bg-[var(--p-content-hover-background)] px-3 py-2 text-xs">
      {{ t('transactions.scope.stopsRule', unitParams()) }}
    </p>
  }

  <div class="mt-5 flex justify-end gap-2">
    <p-button
      type="button"
      severity="secondary"
      [text]="true"
      [label]="t('common.cancel')"
      (onClick)="visible.set(false)"
    />
    <p-button
      type="button"
      [label]="confirmLabel()"
      [severity]="confirmSeverity()"
      (onClick)="onConfirm()"
    />
  </div>
</p-dialog>
