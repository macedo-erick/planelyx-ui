<planelyx-page-header title="Transactions" subtitle="Debits, credits and card charges.">
  <p-button
    icon="pi pi-replay"
    label="Recurring rules"
    severity="secondary"
    [outlined]="true"
    (onClick)="rulesOpen.set(true)"
  />
  <p-button icon="pi pi-plus" label="Add a transaction" (onClick)="openCreate()" />
</planelyx-page-header>

<div class="mb-4 flex flex-wrap items-end gap-3">
  <div class="flex flex-col gap-1">
    <label for="filter-range" class="text-xs font-medium text-[var(--p-text-muted-color)]">
      Date range
    </label>
    <p-datepicker
      inputId="filter-range"
      selectionMode="range"
      [ngModel]="rangeValue()"
      (ngModelChange)="onRangeChange($event)"
      [showButtonBar]="true"
      dateFormat="dd/mm/yy"
      placeholder="Any date"
      appendTo="body"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label for="filter-kind" class="text-xs font-medium text-[var(--p-text-muted-color)]">
      Type
    </label>

    <p-select
      inputId="filter-kind"
      [options]="kindOptions"
      optionLabel="label"
      optionValue="value"
      [ngModel]="kindFilter()"
      (ngModelChange)="onKindChange($event)"
      placeholder="Any type"
      [showClear]="true"
      appendTo="body"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label for="filter-category" class="text-xs font-medium text-[var(--p-text-muted-color)]">
      Category
    </label>
    <p-select
      inputId="filter-category"
      [options]="categoryOptions()"
      optionLabel="label"
      optionValue="value"
      [ngModel]="categoryFilter()"
      (ngModelChange)="onCategoryChange($event)"
      placeholder="Any category"
      [showClear]="true"
      appendTo="body"
    />
  </div>

  <p-button
    severity="secondary"
    [text]="true"
    icon="pi pi-filter-slash"
    label="Clear"
    (onClick)="clearFilters()"
  />

  <div class="ml-auto text-right">
    <div class="text-xs text-[var(--p-text-muted-color)]">Net for this selection</div>
    <div class="text-lg font-semibold tabular-nums" [class.text-red-500]="net() < 0">
      {{ money(net()) }}
    </div>
  </div>
</div>

<planelyx-card>
  @if (service.isLoading()) {
    <p class="px-4 py-12 text-center text-[var(--p-text-muted-color)]">Loading…</p>
  } @else if (rows().length === 0) {
    <planelyx-empty-state
      icon="pi-arrow-right-arrow-left"
      title="Nothing here"
      message="No transactions match the current filters."
    />
  } @else {
    @for (tx of rows(); track tx.id) {
      <planelyx-transaction-row
        [transaction]="tx"
        [category]="category(tx.categoryId)"
        [secondary]="sourceName(tx)"
        (edit)="openEdit(tx)"
      />
    }
  }
</planelyx-card>

@if (service.totalElements() > 0) {
  <!--
    No `block` here. The host already carries PrimeNG's `.p-paginator`, which is
    `display:flex; justify-content:center`, and Tailwind's `utilities` layer is ordered after
    `primeng` in styles.css — so a `block` utility wins and collapses the bar to the left.
  -->
  <p-paginator
    class="mt-3"
    [first]="page() * size()"
    [rows]="size()"
    [rowsPerPageOptions]="[10, 25, 50]"
    [totalRecords]="service.totalElements()"
    (onPageChange)="onPage($event)"
  />
}

<planelyx-transaction-form-dialog [(visible)]="dialogOpen" [transaction]="selected()" />
<planelyx-recurring-rules-dialog [(visible)]="rulesOpen" />
