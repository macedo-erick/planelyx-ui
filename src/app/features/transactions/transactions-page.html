<planelyx-page-header [title]="t('transactions.title')" [subtitle]="t('transactions.subtitle')">
  <p-button
    icon="pi pi-replay"
    [label]="t('transactions.recurringRules')"
    severity="secondary"
    [outlined]="true"
    (onClick)="rulesOpen.set(true)"
  />
  <p-button icon="pi pi-plus" [label]="t('transactions.add')" (onClick)="openCreate()" />
</planelyx-page-header>

<div class="mb-4 flex flex-wrap items-end gap-3">
  <div class="flex flex-col gap-1">
    <label for="filter-range" class="text-xs font-medium text-[var(--p-text-muted-color)]">
      {{ t('transactions.dateRange') }}
    </label>
    <p-datepicker
      inputId="filter-range"
      selectionMode="range"
      [ngModel]="rangeValue()"
      (ngModelChange)="onRangeChange($event)"
      [showButtonBar]="true"
      [dateFormat]="dateFormat()"
      [placeholder]="t('transactions.filters.anyDate')"
      appendTo="body"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label for="filter-kind" class="text-xs font-medium text-[var(--p-text-muted-color)]">
      {{ t('common.type') }}
    </label>

    <p-select
      inputId="filter-kind"
      [options]="kindOptions()"
      optionLabel="label"
      optionValue="value"
      [ngModel]="kindFilter()"
      (ngModelChange)="onKindChange($event)"
      [placeholder]="t('transactions.filters.anyType')"
      [showClear]="true"
      appendTo="body"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label for="filter-category" class="text-xs font-medium text-[var(--p-text-muted-color)]">
      {{ t('common.category') }}
    </label>
    <p-select
      inputId="filter-category"
      [options]="categoryOptions()"
      optionLabel="label"
      optionValue="value"
      [ngModel]="categoryFilter()"
      (ngModelChange)="onCategoryChange($event)"
      [placeholder]="t('transactions.filters.anyCategory')"
      [showClear]="true"
      appendTo="body"
    />
  </div>

  @if (accountFilterVisible()) {
    <div class="flex flex-col gap-1">
      <label for="filter-account" class="text-xs font-medium text-[var(--p-text-muted-color)]">
        {{ t('cards.bankAccount') }}
      </label>
      <p-select
        inputId="filter-account"
        [options]="accountOptions()"
        optionLabel="label"
        optionValue="value"
        [ngModel]="bankAccountFilter()"
        (ngModelChange)="onBankAccountChange($event)"
        [placeholder]="t('transactions.filters.anyAccount')"
        [showClear]="true"
        appendTo="body"
      />
    </div>
  }

  @if (cardFilterVisible()) {
    <div class="flex flex-col gap-1">
      <label for="filter-card" class="text-xs font-medium text-[var(--p-text-muted-color)]">
        {{ t('transactions.creditCard') }}
      </label>
      <p-select
        inputId="filter-card"
        [options]="cardOptions()"
        optionLabel="label"
        optionValue="value"
        [ngModel]="creditCardFilter()"
        (ngModelChange)="onCreditCardChange($event)"
        [placeholder]="t('transactions.filters.anyCard')"
        [showClear]="true"
        appendTo="body"
      />
    </div>
  }

  <p-button
    severity="secondary"
    [text]="true"
    icon="pi pi-filter-slash"
    [label]="t('transactions.filters.clear')"
    (onClick)="clearFilters()"
  />

  <div class="ml-auto text-right">
    <div class="text-xs text-[var(--p-text-muted-color)]">
      {{ t('transactions.netForSelection') }}
    </div>
    <div class="text-lg font-semibold tabular-nums" [class.text-red-500]="net() < 0">
      {{ money(net()) }}
    </div>
  </div>
</div>

<planelyx-card>
  @if (service.isLoading()) {
    <p class="px-4 py-12 text-center text-[var(--p-text-muted-color)]">{{ t('common.loading') }}</p>
  } @else if (rows().length === 0) {
    <planelyx-empty-state
      icon="pi-arrow-right-arrow-left"
      [title]="t('transactions.empty')"
      [message]="t('transactions.emptyMessage')"
    />
  } @else {
    @for (tx of rows(); track tx.id) {
      <planelyx-transaction-row
        [transaction]="tx"
        [category]="category(tx.categoryId)"
        [secondary]="sourceName(tx)"
        [currency]="currencyFor(tx)"
        (edit)="openEdit(tx)"
      />
    }
  }
</planelyx-card>

@if (service.totalElements() > 0) {
  <p-paginator
    class="mt-3"
    [first]="page() * size()"
    [rows]="size()"
    [rowsPerPageOptions]="[10, 25, 50]"
    [totalRecords]="service.totalElements()"
    (onPageChange)="onPage($event)"
  />
}

<planelyx-transaction-form-dialog [(visible)]="dialogOpen" [transaction]="selected()" />
<planelyx-recurring-rules-dialog [(visible)]="rulesOpen" />
