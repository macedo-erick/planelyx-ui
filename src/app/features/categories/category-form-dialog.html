<p-dialog
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  [header]="editing() ? t('categories.editHeader') : t('categories.newHeader')"
  [modal]="true"
  [style]="{ width: '28rem', maxWidth: 'calc(100vw - 2rem)' }"
  [draggable]="false"
>
  <form class="flex flex-col gap-4" novalidate (ngSubmit)="onSubmit()">
    <planelyx-text-input [formField]="f.name" [label]="t('common.name')" placeholder="Groceries" />

    <planelyx-select
      [formField]="f.type"
      [label]="t('common.type')"
      [options]="typeOptions()"
      [hint]="t('categories.typeHint')"
    />

    <planelyx-select
      [formField]="f.icon"
      [label]="t('categories.icon')"
      [options]="iconOptions()"
      [showClear]="true"
    />

    <div class="flex flex-col gap-1.5">
      <label for="category-color" class="text-sm font-medium">{{ t('categories.color') }}</label>
      <div class="flex items-center gap-3">
        <input
          id="category-color"
          type="color"
          class="h-9 w-14 cursor-pointer rounded border border-[var(--p-content-border-color)] bg-transparent"
          [value]="f.color().value() ?? '#3b82f6'"
          (input)="onColorInput($event)"
        />
        @if (f.color().value()) {
          <p-button
            type="button"
            severity="secondary"
            [text]="true"
            size="small"
            [label]="t('common.clear')"
            (onClick)="f.color().value.set(null)"
          />
        }
      </div>
    </div>

    <div class="mt-2 flex items-center justify-between gap-2">
      @if (editing()) {
        <p-button
          type="button"
          icon="pi pi-trash"
          severity="danger"
          [text]="true"
          [label]="t('common.delete')"
          (onClick)="confirmDelete()"
        />
      } @else {
        <span></span>
      }

      <span class="flex gap-2">
        <p-button
          type="button"
          severity="secondary"
          [text]="true"
          [label]="t('common.cancel')"
          (onClick)="visible.set(false)"
        />
        <p-button
          type="submit"
          [label]="editing() ? t('common.save') : t('common.create')"
          [loading]="saving()"
        />
      </span>
    </div>
  </form>
</p-dialog>
