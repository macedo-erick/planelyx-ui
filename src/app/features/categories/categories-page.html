<planelyx-page-header [title]="t('categories.title')" [subtitle]="t('categories.subtitle')">
  <p-button icon="pi pi-plus" [label]="t('categories.new')" (onClick)="openCreate()" />
</planelyx-page-header>

@if (service.isLoading()) {
  <p class="text-[var(--p-text-muted-color)]">{{ t('common.loading') }}</p>
} @else if (categories().length === 0) {
  <planelyx-empty-state
    icon="pi-tags"
    [title]="t('categories.empty')"
    [message]="t('categories.emptyMessage')"
  />
} @else {
  <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3">
    @for (category of categories(); track category.id) {
      <planelyx-card class="group relative">
        <button
          type="button"
          class="absolute inset-0 z-10 rounded-xl enabled:hover:cursor-pointer"
          [attr.aria-label]="t('categories.editAria', { name: category.name })"
          (click)="openEdit(category)"
        ></button>

        <div
          class="flex items-center justify-between gap-3 p-4 group-hover:bg-[var(--p-content-hover-background)]"
        >
          <planelyx-category-badge [category]="category" [showName]="true" size="md" />
          <p-tag
            [value]="typeLabel(category.type)"
            [severity]="category.type === 'INCOME' ? 'success' : 'info'"
          />
        </div>
      </planelyx-card>
    }
  </div>
}

<planelyx-category-form-dialog [(visible)]="dialogOpen" [category]="selected()" />
