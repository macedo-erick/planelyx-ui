<fintrack-page-header title="Categories" subtitle="Every transaction needs one.">
  <p-button icon="pi pi-plus" label="New category" (onClick)="openCreate()" />
</fintrack-page-header>

<p-table
  [value]="categories()"
  [loading]="service.isLoading()"
  [paginator]="categories().length > 20"
  [rows]="20"
  pStyleClass="p-datatable-sm"
  [tableStyle]="{ 'min-width': '32rem' }"
>
  <ng-template #header>
    <tr>
      <th scope="col">Name</th>
      <th scope="col" style="width: 8rem">Type</th>
      <th scope="col" style="width: 7rem" class="text-right">Actions</th>
    </tr>
  </ng-template>

  <ng-template #body let-category>
    <tr>
      <td>
        <fintrack-category-badge [category]="category" [showName]="true" />
      </td>
      <td>
        <p-tag
          [value]="typeLabel(category.type)"
          [severity]="category.type === 'INCOME' ? 'success' : 'info'"
        />
      </td>
      <td class="text-right">
        <p-button
          icon="pi pi-pencil"
          severity="secondary"
          [text]="true"
          [ariaLabel]="'Edit ' + category.name"
          (onClick)="openEdit(category)"
        />
        <p-button
          icon="pi pi-trash"
          severity="danger"
          [text]="true"
          [ariaLabel]="'Delete ' + category.name"
          (onClick)="confirmDelete(category)"
        />
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr>
      <td colspan="3">
        <fintrack-empty-state
          icon="pi-tags"
          title="No categories yet"
          message="Create one before adding transactions."
        />
      </td>
    </tr>
  </ng-template>
</p-table>

<fintrack-category-form-dialog [(visible)]="dialogOpen" [category]="selected()" />
