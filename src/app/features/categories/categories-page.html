<fintrack-page-header title="Categories" subtitle="Every transaction needs one.">
  <p-button icon="pi pi-plus" label="New category" (onClick)="openCreate()" />
</fintrack-page-header>

@if (service.isLoading()) {
  <p class="text-[var(--p-text-muted-color)]">Loading…</p>
} @else if (categories().length === 0) {
  <fintrack-empty-state
    icon="pi-tags"
    title="No categories yet"
    message="Create one before adding transactions."
  />
} @else {
  <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3">
    @for (category of categories(); track category.id) {
      <fintrack-card class="group relative">
        <!--
          Overlay rather than wrapping the body in a <button>: a p-tag is not valid button
          content. Delete lives in the edit dialog, matching the transactions flow.
        -->
        <button
          type="button"
          class="absolute inset-0 z-10 rounded-xl enabled:hover:cursor-pointer"
          [attr.aria-label]="'Edit ' + category.name"
          (click)="openEdit(category)"
        ></button>

        <div
          class="flex items-center justify-between gap-3 p-4 group-hover:bg-[var(--p-content-hover-background)]"
        >
          <fintrack-category-badge [category]="category" [showName]="true" size="md" />
          <p-tag
            [value]="typeLabel(category.type)"
            [severity]="category.type === 'INCOME' ? 'success' : 'info'"
          />
        </div>
      </fintrack-card>
    }
  </div>
}

<fintrack-category-form-dialog [(visible)]="dialogOpen" [category]="selected()" />
