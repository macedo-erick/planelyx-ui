<p-dialog
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  [header]="editing() ? t('accounts.editHeader') : t('accounts.newHeader')"
  [modal]="true"
  [style]="{ width: '30rem', maxWidth: 'calc(100vw - 2rem)' }"
  [draggable]="false"
>
  <form class="flex flex-col gap-4" novalidate (ngSubmit)="onSubmit()">
    <planelyx-text-input
      [formField]="f.name"
      [label]="t('accounts.accountName')"
      placeholder="Everyday"
    />
    <planelyx-text-input
      [formField]="f.bankName"
      [label]="t('accounts.bank')"
      placeholder="Nubank"
    />
    <planelyx-select
      [formField]="f.accountType"
      [label]="t('common.type')"
      [options]="typeOptions()"
    />

    @if (!editing()) {
      <planelyx-money-input
        [formField]="f.initialBalance"
        [label]="t('common.balance')"
        [currency]="f.currency().value() || defaultCurrency"
        [hint]="t('accounts.balanceHint')"
      />
    }

    <planelyx-text-input
      [formField]="f.currency"
      [label]="t('common.currency')"
      placeholder="BRL"
      [hint]="t('accounts.currencyHint')"
    />

    <div class="mt-2 flex flex-wrap items-center justify-between gap-2">
      @if (editing()) {
        <span class="flex gap-2">
          <p-button
            type="button"
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            [label]="t('common.delete')"
            (onClick)="confirmDelete()"
          />
          <p-button
            type="button"
            icon="pi pi-sliders-h"
            severity="secondary"
            [text]="true"
            [label]="t('accounts.adjust.action')"
            (onClick)="openAdjust()"
          />
        </span>
      } @else {
        <span></span>
      }

      <span class="flex gap-2">
        <p-button
          type="button"
          severity="secondary"
          [text]="true"
          [label]="t('common.cancel')"
          (onClick)="visible.set(false)"
        />
        <p-button
          type="submit"
          [label]="editing() ? t('common.save') : t('common.create')"
          [loading]="saving()"
        />
      </span>
    </div>
  </form>
</p-dialog>

<planelyx-adjust-balance-dialog [(visible)]="adjustOpen" [account]="account()" />
