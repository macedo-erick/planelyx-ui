<p-dialog
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  [header]="editing() ? 'Edit card' : 'New credit card'"
  [modal]="true"
  [style]="{ width: '32rem', maxWidth: 'calc(100vw - 2rem)' }"
  [draggable]="false"
>
  <form class="flex flex-col gap-4" novalidate (ngSubmit)="onSubmit()">
    <planelyx-select
      [formField]="f.bankAccountId"
      label="Bank account"
      [options]="accountOptions()"
      hint="Every card is attached to an account."
    />
    <planelyx-text-input [formField]="f.name" label="Card name" placeholder="Nubank Ultravioleta" />
    <planelyx-text-input [formField]="f.brand" label="Brand" placeholder="Mastercard" />
    <planelyx-money-input [formField]="f.creditLimit" label="Credit limit" />

    <!--
      Two day fields fit side by side on a full-width dialog and stack once the dialog is
      capped by a narrow viewport. The spinner buttons are off: they would take a third of
      each column for a value that is faster to type than to click up to.
    -->
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <planelyx-number-input
        [formField]="f.closingDay"
        label="Closing day"
        [showButtons]="false"
        placeholder="1–31"
        hint="Day the bill closes."
      />
      <planelyx-number-input
        [formField]="f.dueDay"
        label="Due day"
        [showButtons]="false"
        placeholder="1–31"
        hint="Rolls to the next month when on or before the closing day."
      />
    </div>

    <div class="mt-2 flex items-center justify-between gap-2">
      @if (editing()) {
        <p-button
          type="button"
          icon="pi pi-trash"
          severity="danger"
          [text]="true"
          label="Delete"
          (onClick)="confirmDelete()"
        />
      } @else {
        <span></span>
      }

      <span class="flex gap-2">
        <p-button
          type="button"
          severity="secondary"
          [text]="true"
          label="Cancel"
          (onClick)="visible.set(false)"
        />
        <p-button type="submit" [label]="editing() ? 'Save' : 'Create'" [loading]="saving()" />
      </span>
    </div>
  </form>
</p-dialog>
