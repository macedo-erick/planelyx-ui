<p-dialog
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  [header]="editing() ? t('cards.editHeader') : t('cards.newHeader')"
  [modal]="true"
  [style]="{ width: '32rem', maxWidth: 'calc(100vw - 2rem)' }"
  [draggable]="false"
>
  <form class="flex flex-col gap-4" novalidate (ngSubmit)="onSubmit()">
    <planelyx-select
      [formField]="f.bankAccountId"
      [label]="t('cards.bankAccount')"
      [options]="accountOptions()"
      [hint]="t('cards.bankAccountHint')"
    />
    <planelyx-text-input
      [formField]="f.name"
      [label]="t('cards.cardName')"
      placeholder="Nubank Ultravioleta"
    />
    <planelyx-text-input
      [formField]="f.brand"
      [label]="t('cards.brand')"
      placeholder="Mastercard"
    />
    <planelyx-money-input [formField]="f.creditLimit" [label]="t('cards.creditLimit')" />

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <planelyx-number-input
        [formField]="f.closingDay"
        [label]="t('cards.closingDay')"
        [showButtons]="false"
        placeholder="1–31"
        [hint]="t('cards.closingDayHint')"
      />
      <planelyx-number-input
        [formField]="f.dueDay"
        [label]="t('cards.dueDay')"
        [showButtons]="false"
        placeholder="1–31"
        [hint]="t('cards.dueDayHint')"
      />
    </div>

    <div class="mt-2 flex items-center justify-between gap-2">
      @if (editing()) {
        <p-button
          type="button"
          icon="pi pi-trash"
          severity="danger"
          [text]="true"
          [label]="t('common.delete')"
          (onClick)="confirmDelete()"
        />
      } @else {
        <span></span>
      }

      <span class="flex gap-2">
        <p-button
          type="button"
          severity="secondary"
          [text]="true"
          [label]="t('common.cancel')"
          (onClick)="visible.set(false)"
        />
        <p-button
          type="submit"
          [label]="editing() ? t('common.save') : t('common.create')"
          [loading]="saving()"
        />
      </span>
    </div>
  </form>
</p-dialog>
