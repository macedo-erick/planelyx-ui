<div class="flex h-full">
  <aside
    class="hidden w-64 shrink-0 flex-col border-r border-[var(--p-content-border-color)] bg-[var(--p-content-background)] lg:flex"
  >
    <ng-container *ngTemplateOutlet="brand" />
    <nav class="flex-1 overflow-y-auto p-3" [attr.aria-label]="t('common.mainNavigation')">
      <ng-container *ngTemplateOutlet="navLinks" />
    </nav>
  </aside>

  <p-drawer [(visible)]="mobileNavOpen" header="Planelyx" styleClass="w-72">
    <nav [attr.aria-label]="t('common.mainNavigation')">
      <ng-container *ngTemplateOutlet="navLinks" />
    </nav>
  </p-drawer>

  <div class="flex min-w-0 flex-1 flex-col">
    <header
      class="flex h-16 shrink-0 items-center gap-3 border-b border-[var(--p-content-border-color)] bg-[var(--p-content-background)] px-4"
    >
      <button
        type="button"
        class="rounded p-2 hover:bg-[var(--p-content-hover-background)] lg:hidden"
        (click)="mobileNavOpen.set(true)"
        [attr.aria-label]="t('common.openNavigation')"
      >
        <i class="pi pi-bars" aria-hidden="true"></i>
      </button>

      <a [routerLink]="homeRoute" class="flex items-center gap-2 rounded font-semibold lg:hidden">
        <planelyx-logo size="1.25rem" />
        Planelyx
      </a>

      <div class="ml-auto flex items-center gap-2">
        <button
          type="button"
          class="rounded p-2 hover:bg-[var(--p-content-hover-background)]"
          (click)="theme.toggle()"
          [attr.aria-pressed]="theme.isDark()"
          [attr.aria-label]="theme.isDark() ? t('common.switchToLight') : t('common.switchToDark')"
        >
          <i
            class="pi"
            [class.pi-moon]="theme.isDark()"
            [class.pi-sun]="!theme.isDark()"
            aria-hidden="true"
          ></i>
        </button>

        <!--
          A p-popover of plain buttons rather than a p-menu: PrimeNG 22.0.0's Menu template
          tracks its @for by a template context variable, which Angular hoists into a
          context-free function, so rendering any item throws
          "ReferenceError: parentId_r3 is not defined". Same workaround as the invoices page.
        -->
        <button
          type="button"
          class="flex items-center gap-2 rounded p-1 hover:bg-[var(--p-content-hover-background)]"
          (click)="userMenu.toggle($event)"
          [attr.aria-label]="t('common.accountMenu', { name: auth.displayName() })"
        >
          <span
            class="grid size-9 place-items-center rounded-full bg-[var(--p-primary-color)] text-sm font-semibold text-[var(--p-primary-contrast-color)]"
            aria-hidden="true"
          >
            {{ auth.initials() }}
          </span>
          <span class="hidden text-sm sm:inline">{{ auth.displayName() }}</span>
          <i class="pi pi-angle-down text-xs" aria-hidden="true"></i>
        </button>

        <p-popover #userMenu>
          <div class="flex w-56 flex-col">
            <div class="border-b border-[var(--p-content-border-color)] px-3 pt-1 pb-2">
              <p class="truncate text-sm font-medium">{{ auth.displayName() }}</p>
              <p class="truncate text-xs text-[var(--p-text-muted-color)]">{{ auth.email() }}</p>
            </div>

            <p-button
              [label]="t('common.profile')"
              icon="pi pi-user"
              severity="secondary"
              [text]="true"
              styleClass="justify-start w-full"
              routerLink="/profile"
              (onClick)="userMenu.hide()"
            />

            <!--
              Each language is written in its own name rather than translated, which is the
              one label a speaker of the other language still recognises.
            -->
            <div class="border-t border-[var(--p-content-border-color)] pt-1">
              <p class="px-3 py-1 text-xs text-[var(--p-text-muted-color)]">
                {{ t('common.language') }}
              </p>
              @for (option of locale.available; track option) {
                <p-button
                  [label]="locale.label(option)"
                  [icon]="option === locale.locale() ? 'pi pi-check' : 'pi pi-fw'"
                  severity="secondary"
                  [text]="true"
                  styleClass="justify-start w-full"
                  (onClick)="locale.set(option)"
                />
              }
            </div>

            <p-button
              [label]="t('common.signOut')"
              icon="pi pi-sign-out"
              severity="secondary"
              [text]="true"
              styleClass="justify-start w-full border-t border-[var(--p-content-border-color)]"
              (onClick)="userMenu.hide(); auth.logout()"
            />
          </div>
        </p-popover>
      </div>
    </header>

    <main class="min-w-0 flex-1 overflow-y-auto p-4 lg:p-6">
      <router-outlet />
    </main>
  </div>
</div>

<p-toast position="bottom-right" />
<p-confirmdialog />

<!--
  The brand sits in the sidebar and the top bar sits beside it, so their bottom borders read
  as one line. Both are pinned to the same height instead of being left to whatever their
  content happens to add up to.
-->
<ng-template #brand>
  <a
    [routerLink]="homeRoute"
    class="flex h-16 shrink-0 items-center gap-2 border-b border-[var(--p-content-border-color)] px-5 text-lg font-semibold"
  >
    <planelyx-logo size="1.5rem" />
    Planelyx
  </a>
</ng-template>

<ng-template #navLinks>
  <ul class="flex flex-col gap-1">
    @for (item of navItems; track item.route) {
      <li>
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-[var(--p-highlight-background)] text-[var(--p-highlight-color)]"
          class="flex items-center gap-3 rounded-md px-3 py-2 text-sm hover:bg-[var(--p-content-hover-background)]"
          (click)="mobileNavOpen.set(false)"
        >
          <i [class]="item.icon" aria-hidden="true"></i>
          {{ t(item.label) }}
        </a>
      </li>
    }
  </ul>
</ng-template>
