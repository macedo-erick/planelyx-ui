@let tx = transaction();

<button
  type="button"
  class="flex w-full items-center gap-3 border-b border-[var(--p-content-border-color)] px-4 py-3 text-left last:border-b-0 enabled:hover:bg-[var(--p-content-hover-background)] enabled:hover:cursor-pointer"
  [disabled]="!interactive()"
  [attr.aria-label]="
    interactive() ? t('transactions.editAria', { description: tx.description }) : null
  "
  [attr.title]="locked() ? t('transactions.systemLocked') : null"
  (click)="edit.emit(tx)"
>
  <planelyx-category-badge [category]="category()" size="md" />

  <span class="min-w-0 flex-1">
    <span class="block truncate font-medium text-[var(--p-text-color)]">
      {{ tx.description }}
      @if (installment(); as label) {
        <span class="font-normal text-[var(--p-text-muted-color)]">({{ label }})</span>
      }
    </span>
    <span class="block truncate text-sm text-[var(--p-text-muted-color)]">
      {{ categoryName() }}
      @if (secondary()) {
        <span> | {{ secondary() }}</span>
      }
      @if (unpaid()) {
        <span
          class="ml-1 rounded border border-[var(--p-content-border-color)] px-1 py-px text-xs text-[var(--p-text-muted-color)]"
        >
          {{ t('transactions.unpaid') }}
        </span>
      }
      @if (tx.templateId && !tx.installmentNumber) {
        <i
          class="pi pi-replay ml-1 text-xs"
          [attr.title]="t('transactions.recurring')"
          aria-hidden="true"
        ></i>
        <span class="sr-only">{{ t('transactions.recurring') }}</span>
      }
    </span>
  </span>

  <span class="shrink-0 text-right">
    <span class="block font-medium tabular-nums" [class]="amountClasses()">{{ amount() }}</span>
    <span class="block text-sm tabular-nums text-[var(--p-text-muted-color)]">{{ date() }}</span>
  </span>
</button>
